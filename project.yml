name: MenuDock

options:
  bundleIdPrefix: com.kai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2+ "approachable concurrency": every declaration is @MainActor unless
    # explicitly marked `nonisolated`. For a UI-bound app this removes almost all
    # actor-isolation noise and makes the few genuinely-background paths obvious.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  MenuDock:
    type: application
    platform: macOS
    sources:
      - path: Sources/MenuDock
      # Generated by `make icon` from Tools/GenerateAppIcon.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MenuDock
        PRODUCT_BUNDLE_IDENTIFIER: com.kai.MenuDock
        INFOPLIST_FILE: Resources/Info.plist
        # Ad-hoc signing keeps local `make run` working with no developer account.
        # Switch to a Developer ID identity + ENABLE_HARDENED_RUNTIME=YES to distribute.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
