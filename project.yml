name: MenuDock

options:
  bundleIdPrefix: com.bebarebears
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2+ "approachable concurrency": every declaration is @MainActor unless
    # explicitly marked `nonisolated`. For a UI-bound app this removes almost all
    # actor-isolation noise and makes the few genuinely-background paths obvious.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    # Shipped builds are universal so one download serves Apple Silicon and Intel.
    # Debug stays native-only — `make run` should not pay for a second slice.
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  MenuDock:
    type: application
    platform: macOS
    sources:
      - path: Sources/MenuDock
      # Generated by `make icon` from Tools/GenerateAppIcon.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MenuDock
        PRODUCT_BUNDLE_IDENTIFIER: com.bebarebears.MenuDock
        INFOPLIST_FILE: Resources/Info.plist
        # Ad-hoc signing keeps `make run` and CI working with no developer account. An
        # ad-hoc signature is what lets the binary run at all on Apple Silicon; it is not
        # a Developer ID, so a downloaded build is quarantined until the user allows it
        # once (see README) or installs via Homebrew with --no-quarantine.
        #
        # It has one sharp edge. macOS pins a permission grant to the signature it was
        # granted to, and an ad-hoc signature has no certificate to pin — so it pins the
        # binary's cdhash, which changes on every single build. The Accessibility
        # permission auto-paste needs is therefore revoked by every rebuild and every
        # update, silently, while System Settings still shows the switch as on. Locally,
        # `make signing-identity` fixes that with a stable self-signed certificate. For
        # shipped builds only a Developer ID does: set the identity here, flip
        # ENABLE_HARDENED_RUNTIME to YES, and add the notarytool step to release.yml.
        # Overridden per-build by the Makefile; see SIGN there.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
